# Xcodeのプロジェクトはこの設定から自動で作る（Macが無くてもGitHub上で作れるように）
# 作り方: xcodegen generate
name: ZipPeek
options:
  bundleIdPrefix: com.kajisho5
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  ZipPeekCore:
    path: Packages/ZipPeekCore

targets:
  ZipPeek:
    type: application
    platform: macOS
    sources:
      - path: ZipPeek
      # 同梱の 7-Zip（scripts/fetch-7zip.sh で取得）。アプリと一緒に署名する
      - path: Vendor/7zip/7zz
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: Vendor/7zip/License.txt
        optional: true
        buildPhase:
          copyFiles:
            destination: resources
            subpath: 7-Zip
    dependencies:
      - package: ZipPeekCore
      - target: ZipPeekPreview
        embed: true
    settings:
      base:
        PRODUCT_NAME: ZipPeek
        PRODUCT_BUNDLE_IDENTIFIER: com.kajisho5.zippeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ZipPeek/ZipPeek.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: ZipPeek/Info.plist
      properties:
        CFBundleDisplayName: ZipPeek
        CFBundleName: ZipPeek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ja, en]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "MIT License. Includes 7-Zip (LGPL) by Igor Pavlov."
        CFBundleDocumentTypes:
          # 圧縮ファイル：「このアプリケーションで開く」に出す（標準の解凍を勝手に置き換えない）
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.archive
              - public.zip-archive
              - com.pkware.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - public.bzip2-archive
              - public.iso-image
          # それ以外のファイル・フォルダ：Dockのアイコンにドラッグして圧縮できるようにする
          - CFBundleTypeName: Any Item
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.item
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7-Zip Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [7z]
              public.mime-type: [application/x-7z-compressed]
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar]
              public.mime-type: [application/vnd.rar]
        # Finderの右クリック（サービス）。表示名は *.lproj/ServicesMenu.strings で日英を切り替える
        NSServices:
          - NSMenuItem: {default: "ZipPeekで圧縮"}
            NSMessage: compressFiles
            NSPortName: ZipPeek
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
          - NSMenuItem: {default: "ZipPeekで解凍"}
            NSMessage: extractFiles
            NSPortName: ZipPeek
            NSRequiredContext: {}
            NSSendFileTypes: [public.archive, public.zip-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive, public.data]
          - NSMenuItem: {default: "ZipPeekで中身を見る"}
            NSMessage: browseFiles
            NSPortName: ZipPeek
            NSRequiredContext: {}
            NSSendFileTypes: [public.archive, public.zip-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive, public.data]
    scheme:
      testTargets: []

  ZipPeekPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: ZipPeekPreview
    dependencies:
      - package: ZipPeekCore
      - sdk: QuickLookUI.framework
    settings:
      base:
        PRODUCT_NAME: ZipPeekPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.kajisho5.zippeek.preview
        CODE_SIGN_ENTITLEMENTS: ZipPeekPreview/ZipPeekPreview.entitlements
        SKIP_INSTALL: YES
    info:
      path: ZipPeekPreview/Info.plist
      properties:
        CFBundleDisplayName: ZipPeek
        CFBundleName: ZipPeekPreview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ja, en]
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewProvider"
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-zip-tar-archive
