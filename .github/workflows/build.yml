name: build

# 変更を送るたびに、GitHubのMacで「テスト → ビルド → 中身の確認」を行う
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Xcodeを選ぶ
        run: bash scripts/select-xcode.sh

      - name: zip読み取り部品のテスト
        working-directory: Packages/NozokiCore
        run: swift test

      - name: Xcodeプロジェクトを作る
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: アプリをビルド（署名なし）
        run: |
          set -o pipefail
          xcodebuild -project Nozoki.xcodeproj -scheme Nozoki -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build | tee build.log | grep -E "warning:|error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: できたアプリの中身を確認
        run: bash scripts/check-app.sh build/Build/Products/Release/nozoki.app

      - name: のぞき窓を画面なしで動かしてみる
        run: bash scripts/check-quicklook.sh build/Build/Products/Release/nozoki.app

      - name: アプリを保存（動作確認用・署名なし）
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent nozoki.app "$GITHUB_WORKSPACE/nozoki-unsigned.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: nozoki-unsigned
          path: nozoki-unsigned.zip
          retention-days: 14
