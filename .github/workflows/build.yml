name: build

# 変更を送るたびに、GitHubのMacで「テスト → ビルド → 中身の確認」を行う
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Xcodeを選ぶ
        run: bash scripts/select-xcode.sh

      - name: 7-Zip を取得（版と指紋を固定）
        run: bash scripts/fetch-7zip.sh

      - name: 部品のテスト（本物の7-Zipで圧縮・解凍も試す）
        working-directory: Packages/ZipPeekCore
        env:
          ZIPPEEK_7ZZ: ${{ github.workspace }}/Vendor/7zip/7zz
        run: swift test 2>&1 | tee test.log; grep -E "Executed [0-9]+ tests" test.log | tail -1; ! grep -q " failed " test.log

      - name: Xcodeプロジェクトを作る
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate
          # アイコン（Icon Composer形式）の種類が正しく登録されたかを記録する
          grep -n "AppIcon.icon" ZipPeek.xcodeproj/project.pbxproj | head -5

      - name: アプリをビルド（署名なし）
        run: |
          set -o pipefail
          xcodebuild -project ZipPeek.xcodeproj -scheme ZipPeek -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build | tee build.log | grep -E "warning:|error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: できたアプリの中身を確認
        run: bash scripts/check-app.sh build/Build/Products/Release/ZipPeek.app

      - name: 文言の日本語訳に抜けがないか
        run: |
          xcodebuild -exportLocalizations -project ZipPeek.xcodeproj -localizationPath loc -exportLanguage ja > /dev/null
          python3 scripts/check-localizations.py loc

      - name: 画面の写真を撮る（見た目の確認用）
        if: success() || failure()
        continue-on-error: true
        run: bash scripts/ui-shots.sh build/Build/Products/Release/ZipPeek.app shots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14
          if-no-files-found: ignore

      - name: アプリを保存（動作確認用・署名なし）
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent ZipPeek.app "$GITHUB_WORKSPACE/ZipPeek-unsigned.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ZipPeek-unsigned
          path: ZipPeek-unsigned.zip
          retention-days: 14
