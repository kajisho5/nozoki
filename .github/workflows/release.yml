name: release

# 「v0.1.0」のような目印（タグ）を付けると、配布用のファイルを作ってリリースページに置く。
# Appleの証明書（Developer ID）が Secrets に登録されていれば、署名とAppleの認証（公証）まで行う。
# 未登録なら署名なし版を置き、そのことをリリースの説明に書く。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcodeを選ぶ
        run: bash scripts/select-xcode.sh

      - name: Xcodeプロジェクトを作ってビルド
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Nozoki.xcodeproj -scheme Nozoki -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | tail -20
          bash scripts/check-app.sh build/Build/Products/Release/nozoki.app

      - name: 証明書を読み込む
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: 署名する（Developer ID）
        if: env.HAS_CERT == 'true'
        run: |
          APP=build/Build/Products/Release/nozoki.app
          ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$ID"
          codesign --force --options runtime --timestamp --sign "$ID" \
            --entitlements NozokiPreview/NozokiPreview.entitlements "$APP/Contents/PlugIns/NozokiPreview.appex"
          codesign --force --options runtime --timestamp --sign "$ID" \
            --entitlements Nozoki/Nozoki.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: dmgを作る
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage
          cp -R build/Build/Products/Release/nozoki.app dist/stage/
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "nozoki" -srcfolder dist/stage -ov -format UDZO "dist/nozoki-$VERSION.dmg"
          echo "DMG=dist/nozoki-$VERSION.dmg" >> "$GITHUB_ENV"

      - name: Appleの認証（公証）を受ける
        if: env.HAS_CERT == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --timestamp --sign "$ID" "$DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t install "$DMG" || true
          rm "$RUNNER_TEMP/key.p8"

      - name: リリースページに置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            NOTE="Appleの署名・認証済みです。dmgを開いて nozoki を「アプリケーション」にドラッグしてください。"
          else
            NOTE="⚠️ この版はAppleの署名がありません。初回は nozoki を右クリック →「開く」で起動してください。"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" "$DMG" --title "nozoki $GITHUB_REF_NAME" --notes "$NOTE" --verify-tag
          else
            echo "タグ以外から動かしたため、リリースは作りません"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nozoki-dmg
          path: dist/*.dmg
