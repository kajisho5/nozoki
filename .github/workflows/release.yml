name: release

# 「v0.1.0」のような目印（タグ）を付けると、配布用の dmg を作ってリリースページに置く。
# 署名（Developer ID）と Apple の公証は kajisho5/runway の共通ワークフローが行う。
# 証明書は kajisho5/hanger、鍵などの Secrets は runway の sync-secrets が配る（runway の repos.txt に登録済み）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # 手動でも試せる（その場合はリリースページには置かず、Artifacts にだけ出す）

permissions:
  contents: read

jobs:
  mac:
    uses: kajisho5/runway/.github/workflows/mac-notarize.yml@main
    with:
      name: ZipPeek
      runner: macos-26
      build: >-
        bash scripts/fetch-7zip.sh
        && brew install xcodegen
        && xcodegen generate
        && xcodebuild -project ZipPeek.xcodeproj -scheme ZipPeek -configuration Release
        -destination 'generic/platform=macOS' -derivedDataPath build
        CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO build | tail -20
        && bash scripts/check-app.sh build/Build/Products/Release/ZipPeek.app
      products: build/Build/Products/Release/ZipPeek.app
      entitlements: ZipPeek/ZipPeek.entitlements
      app_link: true
    secrets: inherit

  # できた dmg を、まっさらな Mac で開いて確かめる（Gatekeeper の判定・拡張のサンドボックス・7-Zip の署名）
  verify:
    needs: mac
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ZipPeek-notarized
          path: dist
      - name: dmg と中のアプリを確かめる
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg)
          echo "== $dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          ls -la "$mnt"
          test -L "$mnt/Applications"
          app="$mnt/ZipPeek.app"
          spctl -a -t exec -vv "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee /tmp/sig.txt
          grep -q "Authority=Developer ID Application" /tmp/sig.txt
          grep -q "runtime" /tmp/sig.txt
          appex="$app/Contents/PlugIns/ZipPeekPreview.appex"
          codesign -d --entitlements - "$appex" 2>/dev/null | tee /tmp/ent.txt
          grep -q "com.apple.security.app-sandbox" /tmp/ent.txt
          codesign -dvv "$app/Contents/MacOS/7zz" 2>&1 | grep "Authority=Developer ID Application"
          "$app/Contents/MacOS/7zz" i | head -1
          hdiutil detach "$mnt" > /dev/null
          echo "すべて確認できました"

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ZipPeek-notarized
          path: dist
      - name: リリースページに置く
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          cat > notes.md <<EOF
          ## ZipPeek ${ver}

          **English** — Download \`ZipPeek-${ver}.dmg\`, open it, and drag ZipPeek into Applications. Then launch it once and turn on "Press Space in Finder to look inside". Signed with Developer ID and notarized by Apple. Requires macOS 14 or later (Apple silicon / Intel).

          **日本語** — \`ZipPeek-${ver}.dmg\` をダウンロードして開き、ZipPeek を「アプリケーション」へドラッグ。一度起動して「Finderでスペースキーを押して中身を見る」をオンにしてください。Developer ID で署名し、Apple の公証済みです。macOS 14 以降（Apple シリコン / Intel）。

          Compression is powered by 7-Zip 26.05 by Igor Pavlov (GNU LGPL).
          EOF
          gh release create "$TAG" dist/*.dmg --repo "$GITHUB_REPOSITORY" --title "ZipPeek ${ver}" --notes-file notes.md
