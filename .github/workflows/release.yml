name: release

# 版番号（project.yml の MARKETING_VERSION）を上げて main に反映すると、まだ出していない版なら自動でリリースする。
# 「v0.1.0」のような目印（タグ）を付けても同じ。手動実行で版を入れても出せる。
# 署名（Developer ID）と Apple の公証は kajisho5/runway の共通ワークフローが行う。
# 証明書は kajisho5/hanger、鍵などの Secrets は runway の sync-secrets が配る（runway の repos.txt に登録済み）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:   # 手動でも動かせる（iPhone の GitHub アプリからも）
    inputs:
      publish_version:
        description: "公開する版（例: 0.1.0）。空なら試しに作るだけで、リリースページには置かない"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # 出すかどうかと版番号を決める
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.publish_version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"; release=true
          elif [ -n "${INPUT_VERSION:-}" ]; then
            ver="${INPUT_VERSION#v}"; release=true
          else
            ver=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
            if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then release=false; else release=true; fi
            # 手動実行で版を空にしたときは、試しに作るだけ
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && release=false
          fi
          echo "版: $ver / 公開: $release"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  mac:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    uses: kajisho5/runway/.github/workflows/mac-notarize.yml@main
    with:
      name: ZipPeek
      version: ${{ needs.check.outputs.version }}
      runner: macos-26
      build: >-
        bash scripts/fetch-7zip.sh
        && brew install xcodegen
        && xcodegen generate
        && xcodebuild -project ZipPeek.xcodeproj -scheme ZipPeek -configuration Release
        -destination 'generic/platform=macOS' -derivedDataPath build
        CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO build | tail -20
        && bash scripts/check-app.sh build/Build/Products/Release/ZipPeek.app
      products: build/Build/Products/Release/ZipPeek.app
      entitlements: ZipPeek/ZipPeek.entitlements
      app_link: true
      # 「ドライブとして開く」の部品（FSKit）は Apple の特別な権限を使うので、Developer ID 用プロファイルを埋め込む。
      # 権限（FSKit Module）は Apple Developer の Identifiers で com.kajisho5.zippeek.mount に有効にしてある
      profiles: |
        ZipPeekMount.appex|com.kajisho5.zippeek.mount|
    secrets: inherit

  # できた dmg を、まっさらな Mac で開いて確かめる（Gatekeeper の判定・拡張のサンドボックス・7-Zip の署名）
  verify:
    needs: [check, mac]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v7
        with:
          name: ZipPeek-notarized
          path: dist
      - name: dmg と中のアプリを確かめる
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg)
          echo "== $dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          ls -la "$mnt"
          test -L "$mnt/Applications"
          app="$mnt/ZipPeek.app"
          # 版番号がリリースと同じか（アップデートの比較に使う）
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          echo "アプリの版: $got / リリース: $VERSION"
          [ "$got" = "$VERSION" ] || { echo "::error::アプリの版番号（${got}）がリリース（${VERSION}）と違う"; exit 1; }
          spctl -a -t exec -vv "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee /tmp/sig.txt
          grep -q "Authority=Developer ID Application" /tmp/sig.txt
          grep -q "runtime" /tmp/sig.txt
          appex="$app/Contents/PlugIns/ZipPeekPreview.appex"
          codesign -d --entitlements - "$appex" 2>/dev/null | tee /tmp/ent.txt
          grep -q "com.apple.security.app-sandbox" /tmp/ent.txt
          codesign -dvv "$app/Contents/MacOS/7zz" 2>&1 | grep "Authority=Developer ID Application"
          "$app/Contents/MacOS/7zz" i | head -1
          # 「ドライブとして開く」の部品：Developer ID で署名され、プロファイルが入っていて、FSKit の権限があるか
          mount_ext="$app/Contents/Extensions/ZipPeekMount.appex"
          codesign -dvv "$mount_ext" 2>&1 | grep "Authority=Developer ID Application"
          test -f "$mount_ext/Contents/embedded.provisionprofile"
          codesign -d --entitlements - "$mount_ext" 2>/dev/null | grep -q "com.apple.developer.fskit.fsmodule"
          hdiutil detach "$mnt" > /dev/null
          echo "すべて確認できました"

      - name: ドライブとして開けるか（入れて、FSKit の部品をオンにして、zip をつないで中を読む）
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          sudo rm -rf /Applications/ZipPeek.app; sudo ditto "$mnt/ZipPeek.app" /Applications/ZipPeek.app
          hdiutil detach "$mnt" > /dev/null
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/ZipPeek.app
          open /Applications/ZipPeek.app; sleep 6; osascript -e 'tell application id "com.kajisho5.zippeek" to quit' || true; sleep 2
          # テスト用の Mac ではシステム設定のスイッチを自動で切り替えられないので、FSKit が覚えている「オンの部品」の一覧に足す
          G="$HOME/Library/Group Containers/group.com.apple.fskit.settings"
          for i in 1 2 3 4 5 6; do [ -f "$G/enabledModules.plist" ] && break; sleep 5; done
          plutil -insert 0 -string com.kajisho5.zippeek.mount "$G/enabledModules.plist"
          killall -9 fskit_agent extensionkitservice 2>/dev/null || true; sleep 3
          printf 'これは架空のテスト用メモです。\n' > /tmp/drive-memo.txt
          (cd /tmp && zip -q drive-test.zip drive-memo.txt)
          mkdir -p "$HOME/zp-drive"
          mount -F -t zippeek /tmp/drive-test.zip "$HOME/zp-drive"
          ls -la "$HOME/zp-drive"
          grep -q "架空" "$HOME/zp-drive/drive-memo.txt"
          umount "$HOME/zp-drive"
          echo "ドライブとして開けた"

      - uses: actions/checkout@v7
        with:
          path: src

      - name: アップデートの入れ替えを試す（同じ dmg を「新しい版」として配って、押して入れ替わるか）
        run: |
          set -euo pipefail
          dmg=$(ls "$PWD"/dist/*.dmg); name=$(basename "$dmg")
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          sudo rm -rf /Applications/ZipPeek.app; sudo ditto "$mnt/ZipPeek.app" /Applications/ZipPeek.app
          sudo chown -R "$USER" /Applications/ZipPeek.app
          hdiutil detach "$mnt" > /dev/null
          before=$(stat -f %i /Applications/ZipPeek.app/Contents/MacOS/ZipPeek)
          mkdir -p feed && cp "$dmg" feed/
          cat > feed/latest.json <<EOF
          {"tag_name": "v99.0.0", "html_url": "https://github.com/kajisho5/zippeek/releases",
           "assets": [{"name": "$name", "browser_download_url": "http://localhost:8765/$name"}]}
          EOF
          (cd feed && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 1
          ZIPPEEK_UPDATE_FEED=http://localhost:8765/latest.json /Applications/ZipPeek.app/Contents/MacOS/ZipPeek &
          sleep 10
          screencapture -x offer.png || true
          T="swift src/scripts/ui-test.swift"
          $T trusted
          P=$($T pos com.kajisho5.zippeek Update)
          echo "「アップデート」ボタンの位置: $P"
          # shellcheck disable=SC2086  # 位置は「x y」の2つに分けて渡す
          $T click $P
          for _ in $(seq 1 30); do
            sleep 2
            after=$(stat -f %i /Applications/ZipPeek.app/Contents/MacOS/ZipPeek 2>/dev/null || echo "$before")
            [ "$after" != "$before" ] && pgrep -x ZipPeek > /dev/null && break
          done
          screencapture -x after.png || true
          echo "入れ替え前: $before / 後: $after"
          [ "$after" != "$before" ] || { echo "::error::アップデートで入れ替わらなかった"; exit 1; }
          pgrep -x ZipPeek > /dev/null || { echo "::error::入れ替え後に再起動しなかった"; exit 1; }
          codesign --verify --strict --deep /Applications/ZipPeek.app
          spctl -a -t exec -vv /Applications/ZipPeek.app
          echo "合格: アップデートの通知から入れ替え・再起動まで動いた"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: update-test
          path: |
            offer.png
            after.png
          if-no-files-found: ignore

  publish:
    needs: [check, verify]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v7
        with:
          name: ZipPeek-notarized
          path: dist
      - name: リリースページに置く
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VERSION"; TAG="v$ver"
          cat > notes.md <<EOF
          ## ZipPeek ${ver}

          **English** — Download \`ZipPeek-${ver}.dmg\`, open it, and drag ZipPeek into Applications. Then launch it once and turn on "Press Space in Finder to look inside". Signed with Developer ID and notarized by Apple. Requires macOS 14 or later (Apple silicon / Intel).

          **日本語** — \`ZipPeek-${ver}.dmg\` をダウンロードして開き、ZipPeek を「アプリケーション」へドラッグ。一度起動して「Finderでスペースキーを押して中身を見る」をオンにしてください。Developer ID で署名し、Apple の公証済みです。macOS 14 以降（Apple シリコン / Intel）。

          Compression is powered by 7-Zip 26.05 by Igor Pavlov (GNU LGPL).
          EOF
          # 版ごとの「新しくなったこと」があれば先頭に入れる
          if [ -f "release-notes/${ver}.md" ]; then
            { head -n 2 notes.md; cat "release-notes/${ver}.md"; tail -n +3 notes.md; } > notes2.md && mv notes2.md notes.md
          fi
          gh release create "$TAG" dist/*.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ZipPeek ${ver}" --notes-file notes.md
